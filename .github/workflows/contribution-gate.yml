name: contribution-gate

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
  issues:
    types: [labeled, unlabeled, closed, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: contribution-gate-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  metadata-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # pull_request_target 具有写权限，因此只检出受信任的默认分支；绝不检出或执行外部 PR 内容。
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Test contribution gate
        run: node --test .github/scripts/contribution-gate.node-test.mjs

      - name: Evaluate contribution metadata
        uses: actions/github-script@v9
        with:
          script: |
            const { pathToFileURL } = require('node:url')
            const moduleUrl = pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/contribution-gate.mjs`).href
            const { runContributionGate } = await import(moduleUrl)
            const outcomes = await runContributionGate({ github, context })
            const current = context.payload.pull_request
              ? outcomes.find((outcome) => outcome.number === context.payload.pull_request.number)
              : null
            if (current && !current.ready) {
              core.setFailed('External contribution requirements are not satisfied; see the gate comment.')
            }
